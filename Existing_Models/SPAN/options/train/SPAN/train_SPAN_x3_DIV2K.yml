# SPAN x3 training on DIV2K
name: SPAN_x3_DIV2K
model_type: SRModel
scale: 3
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: DIV2K
    type: PairedImageDataset
    dataroot_gt: Images/train/HR
    dataroot_lq: Images/train/LR_X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk
    gt_size: 144
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6
    batch_size_per_gpu: 16
    dataset_enlarge_ratio: 100
    prefetch_mode: ~

  val:
    name: DIV2K_valid_x3
    type: PairedImageDataset
    dataroot_gt: Images/test/HR
    dataroot_lq: Images/test/LR_X3
    filename_tmpl: '{}x3'
    io_backend:
      type: disk

network_g:
  type: SPAN
  num_in_ch: 3
  num_out_ch: 3
  feature_channels: 52
  upscale: 3
  img_range: 255.
  rgb_mean: [0.4488, 0.4371, 0.4040]

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  optim_g:
    type: Adam
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [200000]
    gamma: 0.5
  total_iter: 300000
  warmup_iter: -1
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: !!float 5e3
  save_img: false
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 3
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 3
      test_y_channel: false

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
