name: SPAN_x2_ch52_images
model_type: SRModel
scale: 2
num_gpu: auto
manual_seed: 0

datasets:
  test_1:
    name: images
    type: SingleImageDataset
    dataroot_lq: images
    io_backend:
      type: disk




network_g:
  type: SPAN
  num_in_ch: 3
  num_out_ch: 3
  feature_channels: 52
  upscale: 2
  img_range: 255.
  rgb_mean: [0.4488, 0.4371, 0.4040]

path:
  pretrain_network_g: models/spanx2_ch52.pth
  strict_load_g: true
  param_key_g: params

val:
  save_img: true
  suffix: ~
